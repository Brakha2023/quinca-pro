# ============================================
# SYNC RULES - QUINCA PRO
# Permissions par filiale et profil
# ============================================

bucket_definitions:
  # Chaque utilisateur a son propre bucket
  user_data:
    parameters:
      - SELECT id AS user_id FROM utilisateurs WHERE id = request.user_id()
    data:
      # L'utilisateur voit ses propres infos
      - SELECT * FROM utilisateurs WHERE id = bucket.user_id
      
      # Si c'est un DIRECTEUR, il voit TOUTES les filiales
      - SELECT * FROM filiales 
        WHERE EXISTS (
          SELECT 1 FROM utilisateurs 
          WHERE id = bucket.user_id AND profil = 'DIRECTEUR'
        )
      
      # Si c'est un GERANT, il ne voit QUE sa filiale
      - SELECT * FROM filiales 
        WHERE id = (
          SELECT filiale_id FROM utilisateurs 
          WHERE id = bucket.user_id AND profil = 'GERANT'
        )

  # Données de la filiale (articles, stocks, clients, etc.)
  filiale_data:
    parameters:
      - SELECT filiale_id FROM utilisateurs WHERE id = request.user_id()
    data:
      # Caisses de la filiale
      - SELECT * FROM caisses 
        WHERE filiale_id = bucket.filiale_id
      
      # Familles d'articles
      - SELECT * FROM familles_articles 
        WHERE filiale_id = bucket.filiale_id
      
      # Articles (catalogue partagé mais filtré par filiale)
      - SELECT * FROM articles 
        WHERE filiale_id = bucket.filiale_id
      
      # Dépôts
      - SELECT * FROM depots 
        WHERE filiale_id = bucket.filiale_id
      
      # Stocks
      - SELECT * FROM stocks 
        WHERE depot_id IN (
          SELECT id FROM depots WHERE filiale_id = bucket.filiale_id
        )
      
      # Mouvements de stock
      - SELECT * FROM mouvements_stock 
        WHERE filiale_id = bucket.filiale_id
      
      # Clients
      - SELECT * FROM clients 
        WHERE filiale_id = bucket.filiale_id
      
      # Fournisseurs
      - SELECT * FROM fournisseurs 
        WHERE filiale_id = bucket.filiale_id
      
      # Ventes
      - SELECT * FROM ventes 
        WHERE filiale_id = bucket.filiale_id
      
      # Lignes de vente
      - SELECT * FROM lignes_vente 
        WHERE vente_id IN (
          SELECT id FROM ventes WHERE filiale_id = bucket.filiale_id
        )
      
      # Règlements clients
      - SELECT * FROM reglements_clients 
        WHERE filiale_id = bucket.filiale_id
      
      # Commandes fournisseurs
      - SELECT * FROM commandes_fournisseurs 
        WHERE filiale_id = bucket.filiale_id
      
      # Règlements fournisseurs
      - SELECT * FROM reglements_fournisseurs 
        WHERE filiale_id = bucket.filiale_id
      
      # Mouvements de trésorerie
      - SELECT * FROM mouvements_tresorerie 
        WHERE filiale_id = bucket.filiale_id
      
      # Livraisons
      - SELECT * FROM livraisons 
        WHERE filiale_id = bucket.filiale_id
      
      # Journal d'audit
      - SELECT * FROM audit_log 
        WHERE filiale_id = bucket.filiale_id

  # Vue consolidée pour la maison mère (DIRECTEUR uniquement)
  consolidation:
    parameters:
      - SELECT id AS user_id FROM utilisateurs 
        WHERE id = request.user_id() AND profil = 'DIRECTEUR'
    data:
      # Toutes les ventes (pour consolidation)
      - SELECT * FROM ventes
      
      # Tous les mouvements de stock
      - SELECT * FROM mouvements_stock
      
      # Tous les clients (pour créances consolidées)
      - SELECT * FROM clients
      
      # Tous les fournisseurs (pour dettes consolidées)
      - SELECT * FROM fournisseurs