# ============================================================
# SYNC RULES — QUINCA PRO
# À coller dans le dashboard PowerSync (Instance → Sync Rules).
#
# Deux périmètres :
#   * par_filiale : un gérant / caissier / magasinier reçoit toutes les
#     données de SA filiale (et rien d'autre).
#   * global      : le directeur reçoit toutes les filiales (consolidation).
#
# Contraintes PowerSync à garder en tête :
#   * Les requêtes "data" ne peuvent filtrer que sur des colonnes de la table
#     comparées aux paramètres du bucket — pas de jointure ni de sous-requête.
#     D'où la dénormalisation de filiale_id sur lignes_vente et stocks.
#   * request.user_id() = auth.uid() Supabase = utilisateurs.id.
# ============================================================

bucket_definitions:
  # ----------------------------------------------------------
  # Périmètre d'une filiale (profils non directeur)
  # ----------------------------------------------------------
  par_filiale:
    parameters:
      - SELECT filiale_id
        FROM utilisateurs
        WHERE id = request.user_id()
          AND est_actif = true
          AND profil != 'DIRECTEUR'
          AND filiale_id IS NOT NULL
    data:
      - SELECT * FROM filiales WHERE id = bucket.filiale_id
      - SELECT * FROM utilisateurs WHERE filiale_id = bucket.filiale_id
      - SELECT * FROM depots WHERE filiale_id = bucket.filiale_id
      - SELECT * FROM caisses WHERE filiale_id = bucket.filiale_id
      - SELECT * FROM familles_articles WHERE filiale_id = bucket.filiale_id
      - SELECT * FROM articles WHERE filiale_id = bucket.filiale_id
      - SELECT * FROM stocks WHERE filiale_id = bucket.filiale_id
      - SELECT * FROM mouvements_stock WHERE filiale_id = bucket.filiale_id
      - SELECT * FROM clients WHERE filiale_id = bucket.filiale_id
      - SELECT * FROM fournisseurs WHERE filiale_id = bucket.filiale_id
      - SELECT * FROM ventes WHERE filiale_id = bucket.filiale_id
      - SELECT * FROM lignes_vente WHERE filiale_id = bucket.filiale_id
      - SELECT * FROM reglements_clients WHERE filiale_id = bucket.filiale_id
      - SELECT * FROM livraisons WHERE filiale_id = bucket.filiale_id
      - SELECT * FROM commandes_fournisseurs WHERE filiale_id = bucket.filiale_id
      - SELECT * FROM reglements_fournisseurs WHERE filiale_id = bucket.filiale_id
      - SELECT * FROM mouvements_tresorerie WHERE filiale_id = bucket.filiale_id
      - SELECT * FROM audit_log WHERE filiale_id = bucket.filiale_id

  # ----------------------------------------------------------
  # Périmètre global (directeur) : toutes les filiales, pour la consolidation.
  # Le bucket n'existe que si l'utilisateur est directeur actif.
  # ----------------------------------------------------------
  global:
    parameters:
      - SELECT id AS user_id
        FROM utilisateurs
        WHERE id = request.user_id()
          AND est_actif = true
          AND profil = 'DIRECTEUR'
    data:
      - SELECT * FROM filiales
      - SELECT * FROM utilisateurs
      - SELECT * FROM depots
      - SELECT * FROM caisses
      - SELECT * FROM familles_articles
      - SELECT * FROM articles
      - SELECT * FROM stocks
      - SELECT * FROM mouvements_stock
      - SELECT * FROM clients
      - SELECT * FROM fournisseurs
      - SELECT * FROM ventes
      - SELECT * FROM lignes_vente
      - SELECT * FROM reglements_clients
      - SELECT * FROM livraisons
      - SELECT * FROM commandes_fournisseurs
      - SELECT * FROM reglements_fournisseurs
      - SELECT * FROM mouvements_tresorerie
      - SELECT * FROM audit_log
