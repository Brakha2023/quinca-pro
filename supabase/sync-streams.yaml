# ============================================================
# SYNC STREAMS — QUINCA PRO
# À coller dans le dashboard PowerSync : Sync Streams → Edit → Save and Deploy.
# Doc : https://docs.powersync.com/sync/streams/overview
#
# Principe : chaque utilisateur ne reçoit que les filiales listées dans
# `acces_filiales` (table maintenue par trigger côté Postgres) :
#   * gérant / caissier / magasinier → sa filiale ;
#   * directeur → toutes les filiales actives (consolidation).
# Toutes les tables métier portent `filiale_id`, y compris `lignes_vente`
# et `stocks` (dénormalisé exprès : pas de jointure nécessaire).
# ============================================================
config:
  edition: 3

with:
  mes_filiales: SELECT filiale_id FROM acces_filiales WHERE utilisateur_id = auth.user_id()

streams:
  # Ce qu'il faut pour démarrer l'app : profil, filiales, référentiel.
  referentiel:
    auto_subscribe: true
    priority: 1
    queries:
      - SELECT * FROM utilisateurs WHERE id = auth.user_id()
      - SELECT * FROM utilisateurs WHERE filiale_id IN mes_filiales
      - SELECT * FROM filiales WHERE id IN mes_filiales
      - SELECT * FROM depots WHERE filiale_id IN mes_filiales
      - SELECT * FROM caisses WHERE filiale_id IN mes_filiales
      - SELECT * FROM familles_articles WHERE filiale_id IN mes_filiales
      - SELECT * FROM articles WHERE filiale_id IN mes_filiales
      - SELECT * FROM stocks WHERE filiale_id IN mes_filiales
      - SELECT * FROM clients WHERE filiale_id IN mes_filiales
      - SELECT * FROM fournisseurs WHERE filiale_id IN mes_filiales

  # Activité (ventes, mouvements, règlements…) : volumineuse, après le référentiel.
  activite:
    auto_subscribe: true
    priority: 2
    queries:
      - SELECT * FROM ventes WHERE filiale_id IN mes_filiales
      - SELECT * FROM lignes_vente WHERE filiale_id IN mes_filiales
      - SELECT * FROM reglements_clients WHERE filiale_id IN mes_filiales
      - SELECT * FROM proformas WHERE filiale_id IN mes_filiales
      - SELECT * FROM lignes_proforma WHERE filiale_id IN mes_filiales
      - SELECT * FROM livraisons WHERE filiale_id IN mes_filiales
      - SELECT * FROM mouvements_stock WHERE filiale_id IN mes_filiales
      - SELECT * FROM productions WHERE filiale_id IN mes_filiales
      - SELECT * FROM lignes_production WHERE filiale_id IN mes_filiales
      - SELECT * FROM commandes_fournisseurs WHERE filiale_id IN mes_filiales
      - SELECT * FROM lignes_commande_fournisseur WHERE filiale_id IN mes_filiales
      - SELECT * FROM reglements_fournisseurs WHERE filiale_id IN mes_filiales
      - SELECT * FROM mouvements_tresorerie WHERE filiale_id IN mes_filiales

  # Journal d'audit : en dernier.
  audit:
    auto_subscribe: true
    priority: 3
    query: SELECT * FROM audit_log WHERE filiale_id IN mes_filiales
