# ============================================================
# SYNC STREAMS — QUINCA PRO
# À coller dans le dashboard PowerSync : Sync Streams → Edit → Save and Deploy.
# Doc : https://docs.powersync.com/sync/streams/overview
#
# Principe : chaque utilisateur ne reçoit que les filiales listées dans
# `acces_filiales` (table maintenue par trigger côté Postgres) :
#   * gérant / caissier / magasinier → sa filiale ;
#   * directeur → toutes les filiales actives (consolidation).
# Toutes les tables métier portent `filiale_id`, y compris `lignes_vente`
# et `stocks` (dénormalisé exprès : pas de jointure nécessaire).
#
# ------------------------------------------------------------
# HISTORIQUE BORNÉ — `connection.parameter('depuis')`
# ------------------------------------------------------------
# Les règles de synchronisation n'ont pas de `now()` : elles doivent être
# déterministes, une ligne ne peut pas sortir d'un flux en vieillissant toute
# seule. La borne vient donc du poste, qui envoie une date à la connexion
# (`db.connect(connecteur, { params: { depuis } })`, voir
# `infrastructure/powersync/historique.ts` — premier jour du mois, 12 mois en
# arrière, pour que la valeur ne change qu'une fois par mois).
#
# `connection.parameter('depuis') IS NULL OR …` : un poste resté sur une
# ancienne version n'envoie pas la date et continue de tout recevoir. On peut
# donc déployer ce fichier **avant** la mise à jour des postes, sans rien
# casser ni rien priver.
#
# Ce qui n'est pas borné : le référentiel (il ne grossit pas avec le temps) et
# ce qui n'est pas soldé — une créance ou une commande ouverte doit rester
# visible du poste, quel que soit son âge.
#
# `audit_log` n'est plus synchronisé : c'est un journal de surveillance, il se
# consulte sur le serveur (page Audit, en ligne). Il représentait à lui seul
# une bonne part du volume, chaque écriture métier y recopiant la ligne entière.
# ============================================================
config:
  edition: 3

with:
  mes_filiales: SELECT filiale_id FROM acces_filiales WHERE utilisateur_id = auth.user_id()

streams:
  # Ce qu'il faut pour démarrer l'app : profil, filiales, référentiel.
  referentiel:
    auto_subscribe: true
    priority: 1
    queries:
      - SELECT * FROM utilisateurs WHERE id = auth.user_id()
      - SELECT * FROM utilisateurs WHERE filiale_id IN mes_filiales
      # Annuaire des filiales : toutes les filiales actives, pas seulement les
      # siennes. Le transfert inter-filiale a besoin de nommer la destination,
      # et la table ne contient rien de confidentiel (RLS : lecture ouverte aux
      # utilisateurs authentifiés). Le sélecteur de périmètre reste, lui,
      # réservé au directeur.
      - SELECT * FROM filiales WHERE est_active = true
      - SELECT * FROM depots WHERE filiale_id IN mes_filiales
      - SELECT * FROM caisses WHERE filiale_id IN mes_filiales
      - SELECT * FROM familles_articles WHERE filiale_id IN mes_filiales
      - SELECT * FROM articles WHERE filiale_id IN mes_filiales
      - SELECT * FROM stocks WHERE filiale_id IN mes_filiales
      - SELECT * FROM clients WHERE filiale_id IN mes_filiales
      - SELECT * FROM fournisseurs WHERE filiale_id IN mes_filiales
      - SELECT * FROM employes WHERE filiale_id IN mes_filiales

  # Activité des douze derniers mois (voir l'en-tête) : volumineuse, après le référentiel.
  activite:
    auto_subscribe: true
    priority: 2
    queries:
      - SELECT * FROM ventes WHERE filiale_id IN mes_filiales AND (connection.parameter('depuis') IS NULL OR unixepoch(date_vente) >= unixepoch(connection.parameter('depuis')))
      - SELECT * FROM lignes_vente WHERE filiale_id IN mes_filiales AND (connection.parameter('depuis') IS NULL OR unixepoch(created_at) >= unixepoch(connection.parameter('depuis')))
      - SELECT * FROM reglements_clients WHERE filiale_id IN mes_filiales AND (connection.parameter('depuis') IS NULL OR unixepoch(date_reglement) >= unixepoch(connection.parameter('depuis')))
      - SELECT * FROM proformas WHERE filiale_id IN mes_filiales AND (connection.parameter('depuis') IS NULL OR unixepoch(date_proforma) >= unixepoch(connection.parameter('depuis')))
      - SELECT * FROM lignes_proforma WHERE filiale_id IN mes_filiales AND (connection.parameter('depuis') IS NULL OR unixepoch(created_at) >= unixepoch(connection.parameter('depuis')))
      - SELECT * FROM livraisons WHERE filiale_id IN mes_filiales AND (connection.parameter('depuis') IS NULL OR unixepoch(created_at) >= unixepoch(connection.parameter('depuis')))
      - SELECT * FROM mouvements_stock WHERE filiale_id IN mes_filiales AND (connection.parameter('depuis') IS NULL OR unixepoch(created_at) >= unixepoch(connection.parameter('depuis')))
      - SELECT * FROM productions WHERE filiale_id IN mes_filiales AND (connection.parameter('depuis') IS NULL OR unixepoch(created_at) >= unixepoch(connection.parameter('depuis')))
      - SELECT * FROM lignes_production WHERE filiale_id IN mes_filiales AND (connection.parameter('depuis') IS NULL OR unixepoch(created_at) >= unixepoch(connection.parameter('depuis')))
      - SELECT * FROM commandes_fournisseurs WHERE filiale_id IN mes_filiales AND (connection.parameter('depuis') IS NULL OR unixepoch(date_commande) >= unixepoch(connection.parameter('depuis')))
      - SELECT * FROM lignes_commande_fournisseur WHERE filiale_id IN mes_filiales AND (connection.parameter('depuis') IS NULL OR unixepoch(created_at) >= unixepoch(connection.parameter('depuis')))
      - SELECT * FROM reglements_fournisseurs WHERE filiale_id IN mes_filiales AND (connection.parameter('depuis') IS NULL OR unixepoch(date_reglement) >= unixepoch(connection.parameter('depuis')))
      - SELECT * FROM mouvements_tresorerie WHERE filiale_id IN mes_filiales AND (connection.parameter('depuis') IS NULL OR unixepoch(date_operation) >= unixepoch(connection.parameter('depuis')))
      # Transfert inter-filiale : visible des deux côtés (l'expéditeur suit son
      # envoi, le destinataire encaisse à l'arrivée).
      - SELECT * FROM transferts_filiales WHERE filiale_source_id IN mes_filiales AND (connection.parameter('depuis') IS NULL OR unixepoch(created_at) >= unixepoch(connection.parameter('depuis')))
      - SELECT * FROM transferts_filiales WHERE filiale_destination_id IN mes_filiales AND (connection.parameter('depuis') IS NULL OR unixepoch(created_at) >= unixepoch(connection.parameter('depuis')))
      - SELECT * FROM pointages WHERE filiale_id IN mes_filiales AND (connection.parameter('depuis') IS NULL OR unixepoch(date_pointage) >= unixepoch(connection.parameter('depuis')))
      - SELECT * FROM avances_salaire WHERE filiale_id IN mes_filiales AND (connection.parameter('depuis') IS NULL OR unixepoch(date_avance) >= unixepoch(connection.parameter('depuis')))
      - SELECT * FROM paies WHERE filiale_id IN mes_filiales AND (connection.parameter('depuis') IS NULL OR unixepoch(created_at) >= unixepoch(connection.parameter('depuis')))

  # Ce qui n'est pas soldé reste sur le poste, même ancien : une créance se
  # relance, une commande en cours se réceptionne, un transfert en transit
  # s'encaisse. Sans ces requêtes, la borne des douze mois ferait disparaître
  # la pièce tout en laissant le solde au compte.
  encours:
    auto_subscribe: true
    priority: 2
    queries:
      - SELECT * FROM ventes WHERE filiale_id IN mes_filiales AND reste_a_payer > 0 AND statut != 'ANNULEE'
      - SELECT * FROM commandes_fournisseurs WHERE filiale_id IN mes_filiales AND statut IN ('BROUILLON', 'ENVOYEE', 'PARTIELLE')
      - SELECT * FROM commandes_fournisseurs WHERE filiale_id IN mes_filiales AND reste_a_payer > 0 AND statut != 'ANNULEE'
      - SELECT * FROM livraisons WHERE filiale_id IN mes_filiales AND statut IN ('A_PREPARER', 'EN_COURS')
      - SELECT * FROM transferts_filiales WHERE filiale_source_id IN mes_filiales AND statut = 'EN_TRANSIT'
      - SELECT * FROM transferts_filiales WHERE filiale_destination_id IN mes_filiales AND statut = 'EN_TRANSIT'
