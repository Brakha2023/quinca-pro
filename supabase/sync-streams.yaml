# ============================================================
# SYNC STREAMS — QUINCA PRO
# À coller dans le dashboard PowerSync : Sync Streams → Edit → Save and Deploy.
# Doc : https://docs.powersync.com/sync/streams/overview
#
# Principe : chaque utilisateur ne reçoit que les filiales listées dans
# `acces_filiales` (table maintenue par trigger côté Postgres) :
#   * gérant / caissier / magasinier → sa filiale ;
#   * directeur → toutes les filiales actives (consolidation).
# Toutes les tables métier portent `filiale_id`, y compris `lignes_vente`
# et `stocks` (dénormalisé exprès : pas de jointure nécessaire).
#
# ------------------------------------------------------------
# HISTORIQUE BORNÉ — la colonne `dans_fenetre`
# ------------------------------------------------------------
# Ces règles ne savent pas comparer une date à « il y a douze mois » : elles
# doivent être déterministes (pas de `now()`), et un paramètre envoyé par le
# poste ne supporte que l'**égalité** — ni `>=`, ni fonction autour. Une ligne
# ne peut donc pas quitter un flux en vieillissant toute seule.
#
# C'est donc le serveur qui marque les lignes, et le flux se contente d'une
# égalité. `rafraichir_fenetre_historique()` (migration 20260924000000) tourne
# une fois par jour : elle garde les douze derniers mois **et** tout ce qui
# n'est pas soldé — une créance se relance et une commande ouverte se
# réceptionne, même deux ans après.
#
#   https://docs.powersync.com/sync/advanced/sync-data-by-time
#
# `audit_log` n'est plus synchronisé : c'est un journal de surveillance, il se
# consulte sur le serveur (page Audit, en ligne). Il représentait à lui seul
# une bonne part du volume, chaque écriture métier y recopiant la ligne entière.
# ============================================================
config:
  edition: 3

with:
  mes_filiales: SELECT filiale_id FROM acces_filiales WHERE utilisateur_id = auth.user_id()

streams:
  # Ce qu'il faut pour démarrer l'app : profil, filiales, référentiel.
  # Rien ici n'est borné dans le temps : le référentiel ne grossit pas avec les années.
  referentiel:
    auto_subscribe: true
    priority: 1
    queries:
      - SELECT * FROM utilisateurs WHERE id = auth.user_id()
      - SELECT * FROM utilisateurs WHERE filiale_id IN mes_filiales
      # Rôles et permissions : l'annuaire complet, sans filtre. Deux raisons —
      # le poste a besoin des permissions de son porteur pour fonctionner hors
      # ligne, et l'écran Paramètres administre tous les rôles. Deux tables
      # courtes (quelques dizaines de lignes), rien de confidentiel : un rôle
      # dit ce qu'on peut faire, pas ce qui s'est passé.
      - SELECT * FROM roles
      - SELECT * FROM roles_permissions
      # Annuaire des filiales : toutes les filiales actives, pas seulement les
      # siennes. Le transfert inter-filiale a besoin de nommer la destination,
      # et la table ne contient rien de confidentiel (RLS : lecture ouverte aux
      # utilisateurs authentifiés). Le sélecteur de périmètre reste, lui,
      # réservé au directeur.
      # Configuration de chaque filiale : identité, fiscalité, papiers. Le
      # poste en a besoin pour imprimer un document hors ligne — sans elle, il
      # ne sait pas quel en-tête mettre. Une ligne par filiale, sans filtre :
      # un directeur imprime pour n'importe laquelle de ses filiales.
      - SELECT * FROM parametres_filiale
      - SELECT * FROM filiales WHERE est_active = true
      - SELECT * FROM depots WHERE filiale_id IN mes_filiales
      - SELECT * FROM caisses WHERE filiale_id IN mes_filiales
      - SELECT * FROM familles_articles WHERE filiale_id IN mes_filiales
      - SELECT * FROM articles WHERE filiale_id IN mes_filiales
      - SELECT * FROM stocks WHERE filiale_id IN mes_filiales
      - SELECT * FROM clients WHERE filiale_id IN mes_filiales
      - SELECT * FROM fournisseurs WHERE filiale_id IN mes_filiales
      - SELECT * FROM employes WHERE filiale_id IN mes_filiales

  # Activité : volumineuse, après le référentiel, et bornée (voir l'en-tête).
  activite:
    auto_subscribe: true
    priority: 2
    queries:
      - SELECT * FROM ventes WHERE filiale_id IN mes_filiales AND dans_fenetre = true
      - SELECT * FROM lignes_vente WHERE filiale_id IN mes_filiales AND dans_fenetre = true
      # Ventes mises de côté : partagées entre les postes d'une filiale, pour
      # qu'un ticket se reprenne d'une autre caisse. Pas de `dans_fenetre` —
      # un brouillon vit quelques heures, et la table reste courte.
      - SELECT * FROM ventes_brouillons WHERE filiale_id IN mes_filiales
      - SELECT * FROM reglements_clients WHERE filiale_id IN mes_filiales AND dans_fenetre = true
      - SELECT * FROM proformas WHERE filiale_id IN mes_filiales AND dans_fenetre = true
      - SELECT * FROM lignes_proforma WHERE filiale_id IN mes_filiales AND dans_fenetre = true
      - SELECT * FROM livraisons WHERE filiale_id IN mes_filiales AND dans_fenetre = true
      - SELECT * FROM mouvements_stock WHERE filiale_id IN mes_filiales AND dans_fenetre = true
      - SELECT * FROM productions WHERE filiale_id IN mes_filiales AND dans_fenetre = true
      - SELECT * FROM lignes_production WHERE filiale_id IN mes_filiales AND dans_fenetre = true
      - SELECT * FROM commandes_fournisseurs WHERE filiale_id IN mes_filiales AND dans_fenetre = true
      - SELECT * FROM lignes_commande_fournisseur WHERE filiale_id IN mes_filiales AND dans_fenetre = true
      - SELECT * FROM reglements_fournisseurs WHERE filiale_id IN mes_filiales AND dans_fenetre = true
      - SELECT * FROM mouvements_tresorerie WHERE filiale_id IN mes_filiales AND dans_fenetre = true
      # Transfert inter-filiale : visible des deux côtés (l'expéditeur suit son
      # envoi, le destinataire encaisse à l'arrivée).
      - SELECT * FROM transferts_filiales WHERE filiale_source_id IN mes_filiales AND dans_fenetre = true
      - SELECT * FROM transferts_filiales WHERE filiale_destination_id IN mes_filiales AND dans_fenetre = true
      # Transfert de stock entre filiales : même principe, la marchandise part
      # d'un côté et entre de l'autre ; le bon et ses lignes doivent être
      # lisibles des deux, sinon le destinataire reçoit une pièce vide.
      - SELECT * FROM transferts_stock WHERE filiale_source_id IN mes_filiales AND dans_fenetre = true
      - SELECT * FROM transferts_stock WHERE filiale_destination_id IN mes_filiales AND dans_fenetre = true
      - SELECT * FROM lignes_transfert_stock WHERE filiale_source_id IN mes_filiales AND dans_fenetre = true
      - SELECT * FROM lignes_transfert_stock WHERE filiale_destination_id IN mes_filiales AND dans_fenetre = true
      - SELECT * FROM pointages WHERE filiale_id IN mes_filiales AND dans_fenetre = true
      - SELECT * FROM avances_salaire WHERE filiale_id IN mes_filiales AND dans_fenetre = true
      - SELECT * FROM paies WHERE filiale_id IN mes_filiales AND dans_fenetre = true
